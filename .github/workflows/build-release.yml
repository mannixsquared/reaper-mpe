name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-universal
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fetch pinned REAPER SDK and WDL
        run: python scripts/bootstrap.py
      - name: Configure universal macOS build
        if: runner.os == 'macOS'
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Configure Windows x64 build
        if: runner.os == 'Windows'
        run: cmake -S . -B build/ci -G 'Visual Studio 17 2022' -A x64
      - name: Build
        run: cmake --build build/ci --config Release --parallel
      - name: Test (assertions enabled in Release)
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Verify macOS architectures and signature
        if: runner.os == 'macOS'
        run: |
          lipo -verify_arch arm64 x86_64 build/ci/reaper_mpe_editor.dylib
          codesign --verify --strict build/ci/reaper_mpe_editor.dylib
          python scripts/package.py --platform macos-universal --binary build/ci/reaper_mpe_editor.dylib
      - name: Verify Windows exports and package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = 'build/ci/Release/reaper_mpe_editor.dll'
          if (!(Test-Path $dll)) { throw 'Plugin DLL missing' }
          python scripts/package.py --platform windows-x64 --binary $dll
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: reaper-mpe-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: reaper-mpe-*
          path: dist
          merge-multiple: true
      - name: Publish tested archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(find dist -name '*.zip' | wc -l)" -eq 2
          gh release create "$TAG" dist/* --verify-tag --title "REAPER MPE $TAG" --notes-file RELEASE_NOTES.md --prerelease
